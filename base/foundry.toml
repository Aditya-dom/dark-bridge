[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./" }]
extra_output_files = ['abi']
optimizer = true
optimizer_runs = 999999
solc_version = "0.8.28"
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/", "@inco/lightning/=node_modules/@inco/lightning/src/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
gas_limit = "18446744073709551615"

# RPC endpoints for fork testing
[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base_mainnet = "https://mainnet.base.org"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[fmt]
sort_imports = true
wrap_comments = true

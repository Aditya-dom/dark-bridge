[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./" }]
extra_output_files = ['abi']
optimizer = true
optimizer_runs = 999999
solc_version = "0.8.28"
via-ir = false
remappings = ["forge-std/=node_modules/forge-std/src/", "solady/=node_modules/solady/src/", "@inco/lightning/=node_modules/@inco/lightning/src/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
gas_limit = "18446744073709551615"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[fmt]
sort_imports = true
wrap_comments = true
